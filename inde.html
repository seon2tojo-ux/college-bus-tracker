<!DOCTYPE html>
<html>
<head>
<title>College Bus Tracker</title>

<style>
body{
font-family: Arial;
text-align:center;
background:#f2f2f2;
}

#map{
height:500px;
width:100%;
}
</style>

</head>

<body>

<h1>College Bus Tracker</h1>

<div id="map"></div>

<script>

function initMap(){

var busLocation = {lat:10.5276,lng:76.2144};

var map = new google.maps.Map(
document.getElementById("map"),
{
zoom:13,
center:busLocation
});

var marker = new google.maps.Marker({
position:busLocation,
map:map,
title:"Bus Location"
});

}

</script>

<script async
src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap">
</script>

</body>
</html>
